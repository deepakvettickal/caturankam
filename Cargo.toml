[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/deepakvettickal/caturankam"

[workspace.dependencies]
caturankam-core = { path = "crates/core" }
caturankam-theme = { path = "crates/theme" }
eframe = "0.36"
egui_extras = { version = "0.36", default-features = false, features = ["svg"] }
serde = { version = "1", features = ["derive"] }
shakmaty = "0.30"
thiserror = "2"
toml = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
