[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/deepakvettickal/caturankam"

[workspace.dependencies]
caturankam-core = { path = "crates/core" }
caturankam-lichess = { path = "crates/lichess" }
caturankam-theme = { path = "crates/theme" }
base64 = "0.23"
dirs = "7"
getrandom = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
keyring = "4"
memmap2 = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "form", "query"] }
serde_json = "1"
sha2 = "0.11"
tokio = "1"
eframe = "0.36"
egui_extras = { version = "0.36", default-features = false, features = ["svg", "image"] }
serde = { version = "1", features = ["derive"] }
shakmaty = "0.30"
thiserror = "2"
toml = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
