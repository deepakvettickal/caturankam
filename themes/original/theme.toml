# Original: a calm, normal chessboard. Paper, hairlines, one highlighter accent.
name = "Original"
id = "original"

[board]
light = "#ECE6D8"
dark  = "#B3A589"
highlight = "#E3E866"   # selected square and last move
coordinates = "subtle"  # none | subtle

[pieces]
set = "pieces/"         # wK.svg ... bP.svg (Cburnett, BSD-3-Clause, see ASSETS.md)

[animation]
move_ms = 200

[ui]
background = "#F6F6F2"  # paper
surface = "#FFFFFF"     # buttons, cards
line = "#E1E1DA"        # hairlines
text = "#1D1D1B"
muted = "#77776F"
primary = "#1D1D1B"     # the one dark button
accent = "#EDF07B"      # highlighter

[ui_dark]
background = "#121211"
surface = "#1B1B19"
line = "#2C2C29"
text = "#ECECE8"
muted = "#8E8E87"
primary = "#ECECE8"     # inverted: a light button on dark paper
accent = "#E3E866"
